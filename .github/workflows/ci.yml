name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned vendored-source revisions used to regenerate the committed specs.
  SWAPLOCK_CORE_COMMIT: 7b471be9d1cc051e7a3563a639a9ee98979de9d8
  BITSHARES_CORE_COMMIT: b92b82ba3e57381d111f28383e8cfa89a8356966

jobs:
  typescript:
    name: Native TypeScript bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-graphene-packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: open-graphene-packages/typescript/pnpm-lock.yaml
      - run: cargo fetch --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check
      - run: pnpm test
      - run: pnpm test:react:matrix
      - run: pnpm test:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unpack pinned Swaplock test sources
        run: .github/source-snapshots/unpack-swaplock.sh "$SWAPLOCK_CORE_COMMIT"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  regen:
    name: Generated output is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned chain sources
        run: |
          fetch() {
            local url="$1" dir="$2" commit="$3"
            mkdir -p "$dir" && cd "$dir"
            git init -q && git remote add origin "$url"
            git fetch -q --depth 1 origin "$commit"
            git checkout -q FETCH_HEAD
            cd - >/dev/null
          }
          .github/source-snapshots/unpack-swaplock.sh "$SWAPLOCK_CORE_COMMIT"
          fetch https://github.com/bitshares/bitshares-core.git \
            blockchains/bitshares/bitshares-core "$BITSHARES_CORE_COMMIT"
      - name: Regenerate specs and bindings
        run: |
          open-graphene-packages/rust/graphene-chain-swaplock/graphene-chain-swaplock-spec/bin/gen.sh
          open-graphene-packages/rust/graphene-chain-swaplock/graphene-chain-swaplock-bindings/bin/gen.sh
          open-graphene-packages/rust/graphene-chain-bitshares/graphene-chain-bitshares-spec/bin/gen.sh
          open-graphene-packages/rust/graphene-chain-bitshares/graphene-chain-bitshares-bindings/bin/gen.sh
      - name: Committed output must match the generators
        run: |
          git add -N .
          if ! git diff --exit-code -- open-graphene-packages; then
            echo '::error::Generated output drifted — rerun the gen.sh scripts and commit the result.'
            exit 1
          fi
