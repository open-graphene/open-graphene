object_structs = [
  "asset_object",
  "data_room_object",
  "data_room_member_object",
  "data_room_key_epoch_object",
  "content_card_object",
  "content_card_grant_object",
  "fee_grant_object",
]

[chain]
id = "actanet"
public_key_prefix = "ACTA"
# The chain ID is the SHA-256 of this file in actanet-core, so it follows the genesis on every
# regeneration. The dev genesis is the only one a node starts from today: the embedded
# genesis.json is still the BitShares mainnet snapshot. Switch to libraries/egenesis/genesis.json
# once the Actanet genesis replaces it.
# A node started with --genesis-timestamp or --dbg-init-key hashes the file with "BOGUS"
# appended, so its chain ID differs from this one.
genesis = "libraries/egenesis/genesis-dev.json"

[source]
# Default: the actanet-core clone next to this workspace (mirrorboards-core/mirrorboards-actanet).
chain_repo = "../../../../../mirrorboards-actanet/actanet-core"
# Point this at another checkout to generate from it instead.
chain_repo_env = "ACTANET_CORE_REPO"

[output]
dist = "./dist/actanet.open-graphene.json"

[[rpc_apis]]
name = "database"
class = "database_api"
discover_method = "database"
methods = [
