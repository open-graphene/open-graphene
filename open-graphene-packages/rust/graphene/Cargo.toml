[package]
name = "graphene"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level Open Graphene Rust API facade."
repository = "https://github.com/open-graphene/open-graphene"

[dependencies]
graphene-chain-swaplock-api = { path = "../graphene-chain-swaplock/graphene-chain-swaplock-api" }
open-graphene-fc = { path = "../graphene-fc" }

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }

