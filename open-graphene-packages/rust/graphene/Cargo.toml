[package]
name = "graphene"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level Open Graphene Rust API facade."
repository = "https://github.com/open-graphene/open-graphene"

[dependencies]
graphene-chain-swaplock-api = { path = "../graphene-chain-swaplock/graphene-chain-swaplock-api" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "swaplock_database_account_get"
path = "examples/swaplock/database_account_get.rs"

[[example]]
name = "swaplock_database_account_subscribe"
path = "examples/swaplock/database_account_subscribe.rs"

[[example]]
name = "swaplock_database_account_balances_get"
path = "examples/swaplock/database_account_balances_get.rs"

[[example]]
name = "swaplock_database_asset_get"
path = "examples/swaplock/database_asset_get.rs"

[[example]]
name = "swaplock_database_asset_subscribe"
path = "examples/swaplock/database_asset_subscribe.rs"

[[example]]
name = "swaplock_database_accounts_get"
path = "examples/swaplock/database_accounts_get.rs"

[[example]]
name = "swaplock_database_chain_id_get"
path = "examples/swaplock/database_chain_id_get.rs"

[[example]]
name = "swaplock_database_chain_properties_get"
path = "examples/swaplock/database_chain_properties_get.rs"

[[example]]
name = "swaplock_database_dynamic_global_properties_get"
path = "examples/swaplock/database_dynamic_global_properties_get.rs"

[[example]]
name = "swaplock_database_dynamic_global_properties_subscribe"
path = "examples/swaplock/database_dynamic_global_properties_subscribe.rs"

[[example]]
name = "swaplock_database_global_properties_get"
path = "examples/swaplock/database_global_properties_get.rs"
