[package]
name = "open-graphene-fc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"

[dependencies]
aes = "0.8"
bs58 = "0.5"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
ripemd = "0.1"
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
