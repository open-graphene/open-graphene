[package]
name = "open-graphene-transport"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"
description = "Chain-agnostic Graphene JSON-RPC transport primitives for Open Graphene."

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
