object_structs = [
  "asset_object",
  "account_object",
  "account_balance_object",
  "asset_dynamic_data_object",
  "global_property_object",
  "chain_property_object",
  "data_room_object",
  "data_room_member_object",
  "data_room_key_epoch_object",
  "content_card_object",
]

[chain]
id = "swaplock"
public_key_prefix = "BTS"
chain_id = "2267f694d96b7ffdcba1a98c63c09e720a18a85ad34954e299c66d5a42234098"

[source]
chain_repo = "../../../../blockchains/swaplock/swaplock-core"

[output]
dist = "./dist/swaplock.open-graphene.json"

[[rpc_apis]]
name = "database"
class = "database_api"
discover_method = "database"
methods = [
  "get_objects",
  "get_block_header",
  "get_block",
  "get_account_balances",
  "get_accounts",
  "get_full_accounts",
  "get_chain_properties",
  "get_dynamic_global_properties",
  "get_global_properties",
  "get_limit_orders",
  "get_chain_id",
  "get_config",
  "get_key_references",
  "get_assets",
  "lookup_asset_symbols",
  "list_assets",
  "lookup_accounts",
  "get_ticker",
  "get_required_fees",
  "get_data_room_by_id",
  "get_data_rooms_by_owner",
  "get_data_rooms_by_subject",
  "get_data_room_members",
  "get_data_room_member",
  "get_data_rooms_by_member",
  "get_data_room_key_epochs",
  "get_data_room_key_epoch",
  "get_content_card_by_id",
  "get_content_cards_by_room",
  "get_content_cards_by_author",
]

[[rpc_apis]]
name = "history"
class = "history_api"
discover_method = "history"
methods = [
  "get_account_history",
  "get_fill_order_history",
  "get_market_history",
]

[[rpc_apis]]
name = "orders"
class = "orders_api"
discover_method = "orders"
methods = [
  "get_tracked_groups",
  "get_grouped_limit_orders",
]

[[rpc_apis]]
name = "crypto"
class = "crypto_api"
