methods = [
  "blind",
  "blind_sum",
  "verify_sum",
  "verify_range",
  "range_proof_sign",
  "verify_range_proof_rewind",
  "range_get_info",
]

[[rpc_apis]]
name = "network_broadcast"
class = "network_broadcast_api"
