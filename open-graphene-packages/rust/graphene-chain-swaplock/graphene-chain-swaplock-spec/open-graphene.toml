object_structs = [
  "asset_object",
  "account_object",
  "account_balance_object",
  "asset_dynamic_data_object",
  "global_property_object",
  "chain_property_object",
  "data_room_object",
  "data_room_member_object",
  "data_room_key_epoch_object",
  "content_card_object",
  "content_card_grant_object",
  "content_card_link_object",
]

[chain]
id = "swaplock"
public_key_prefix = "BTS"
chain_id = "3b4f346481a66146d732eb22a43b5956134e5bea6124b379033589146036cbbf"

[source]
# Domyślnie klon przypięty na commit, który CI pobiera pod blockchains/ - to on sprawia, że
# sprawdzenie „zacommitowany output zgadza się z generatorem" cokolwiek znaczy.
chain_repo = "../../../../blockchains/swaplock/swaplock-core"
# Pracując nad łańcuchem ustaw to na roboczy klon, np.
#   export SWAPLOCK_CORE_REPO=~/workspaces/globalmarketchain/boards/boards-swaplock/swaplock-core
# Przypięta kopia z definicji zostaje w tyle, a spec generowany ze starego źródła cicho
# rozjeżdża się z tym, co robi węzeł.
chain_repo_env = "SWAPLOCK_CORE_REPO"

[output]
dist = "./dist/swaplock.open-graphene.json"

[[rpc_apis]]
name = "database"
class = "database_api"
discover_method = "database"
methods = [
  "get_objects",
  "get_block_header",
  "get_block",
  "get_account_balances",
  "get_accounts",
  "get_full_accounts",
  "get_chain_properties",
  "get_dynamic_global_properties",
  "get_global_properties",
  "get_limit_orders",
  "get_chain_id",
  "get_config",
  "get_key_references",
  "get_assets",
  "lookup_asset_symbols",
  "list_assets",
  "lookup_accounts",
  "get_ticker",
  "get_required_fees",
  "get_data_room_by_id",
  "get_data_room_access_state",
  "get_data_rooms_by_owner",
  "get_data_rooms_by_subject",
  "get_data_room_members",
  "get_data_room_member",
  "get_data_rooms_by_member",
  "get_data_room_key_epochs",
  "get_data_room_key_epoch",
  "get_content_card_by_id",
  "get_content_cards_by_room",
  "get_content_cards_by_author",
  "get_content_card_grants_by_card",
  "get_content_card_grant",
  "get_content_card_grants_by_grantee",
]

[[rpc_apis]]
