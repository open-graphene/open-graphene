[package]
name = "graphene-chain-swaplock-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Serializacja i digest transakcji swaplock dla przeglądarki."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# BEZ `signing`: przeglądarka ma tu SPRAWDZAĆ digest, a nie podpisywać.
# Podpisuje warstwa kluczy, własnym, czysto rustowym krypto. Dzięki temu ta
# paczka nie ciągnie wiązania do kodu C i buduje się na wasm32 bez łańcucha
# narzędzi C.
graphene-chain-swaplock-bindings = { path = "../graphene-chain-swaplock-bindings", default-features = false }
hex = "0.4"
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
wasm-bindgen = "0.2"

# RustCrypto ciągnie jeszcze poprzednią generację `getrandom` (przez
# `secp256k1` i `rand_core 0.6`), a ona na wasm32 wymaga jawnego zaplecza.
# Wpisana WYŁĄCZNIE po to, żeby włączyć jej `js` — nie wołamy jej wprost.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
