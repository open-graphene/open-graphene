[package]
name = "graphene-chain-swaplock"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level Swaplock SDK client and live scenario helpers for Open Graphene."

[dependencies]
graphene-chain-swaplock-bindings = { path = "../graphene-chain-swaplock-bindings" }
open-graphene-sdk-core = { path = "../../graphene-sdk-core" }
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
