[package]
name = "graphene-chain-swaplock-bindings"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generated Rust bindings for the swaplock Open Graphene protocol."

[features]
default = ["signing"]
# Przekazywana w dół: bez niej zostaje sama serializacja, bez wiązania do C.
signing = ["open-graphene-fc/signing"]

[dependencies]
open-graphene-core = { path = "../../graphene-core" }
open-graphene-fc = { path = "../../graphene-fc", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
utoipa.workspace = true

[dev-dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
