[package]
name = "graphene-chain-swaplock-bindings"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generated Rust bindings for the swaplock Open Graphene protocol."

[dependencies]
open-graphene-fc = { path = "../../graphene-fc" }
open-graphene-sdk-core = { path = "../../graphene-sdk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
