[package]
name = "graphene-chain-swaplock-api"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level Swaplock API surface for Open Graphene."
repository = "https://github.com/open-graphene/open-graphene"

[dependencies]
graphene-chain-swaplock-bindings = { path = "../graphene-chain-swaplock-bindings" }
hex = "0.4"
open-graphene-core = { path = "../../graphene-core" }
open-graphene-transport = { path = "../../graphene-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
