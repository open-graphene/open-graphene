[package]
name = "graphene-chain-bitshares-bindings"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Generated Rust bindings for the BitShares Open Graphene protocol."

[features]
default = ["signing"]
signing = ["open-graphene-fc/signing"]

[dependencies]
open-graphene-fc = { path = "../../graphene-fc", default-features = false }
open-graphene-core = { path = "../../graphene-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
utoipa.workspace = true
