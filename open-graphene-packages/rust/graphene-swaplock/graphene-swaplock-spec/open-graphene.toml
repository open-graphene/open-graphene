[chain]
id = "swaplock"
public_key_prefix = "BTS"

[source]
chain_repo = "../../../../blockchains/swaplock/swaplock-core"

[output]
dist = "./dist/swaplock.open-graphene.json"

[[rpc_apis]]
name = "database"
class = "database_api"
discover_method = "database"
methods = [
  "get_objects",
  "get_block_header",
  "get_block",
]

[[rpc_apis]]
name = "history"
class = "history_api"
discover_method = "history"
methods = [
  "get_account_history",
]
