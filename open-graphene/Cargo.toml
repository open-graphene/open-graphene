[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"

[workspace.dependencies]
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26.9"
tree-sitter-cpp = "0.23.4"
walkdir = "2"
pretty_assertions = "1"
