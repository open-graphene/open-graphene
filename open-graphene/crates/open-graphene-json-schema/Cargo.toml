[package]
name = "open-graphene-json-schema"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"
description = "Canonical v3 IR and JSON Schema for Open Graphene protocol descriptions."

[dependencies]
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"

[[example]]
name = "emit-schema"
path = "examples/emit_schema.rs"
