[package]
name = "open-graphene-gen-bindings-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"
description = "Generate Rust bindings from Open Graphene protocol specifications."

[dependencies]
open-graphene-codegen-common = { path = "../open-graphene-codegen-common" }
open-graphene-json-schema = { path = "../open-graphene-json-schema" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
