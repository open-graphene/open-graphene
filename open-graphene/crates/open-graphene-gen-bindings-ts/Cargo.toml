[package]
name = "open-graphene-gen-bindings-ts"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-graphene/open-graphene"
description = "Generate native TypeScript protocol bindings from the Open Graphene IR"

[dependencies]
open-graphene-json-schema = { path = "../open-graphene-json-schema" }
open-graphene-codegen-common = { path = "../open-graphene-codegen-common" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
